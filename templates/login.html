<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Entrar | C&V MARKET</title><link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}"></head>
<body class="login-page"><main class="login-card"><div class="login-brand"><span>C&V</span> MARKET</div><h1>Bem-vindo</h1><p>Acesse o controle de recebimento de mercadorias.</p>{% with messages = get_flashed_messages(with_categories=true) %}{% for categoria, mensagem in messages %}<div class="alert {{ categoria }}">{{ mensagem }}</div>{% endfor %}{% endwith %}<form method="post"><label for="email">E-mail</label><input id="email" name="email" type="email" placeholder="voce@empresa.com" required autofocus><label for="senha">Senha</label><input id="senha" name="senha" type="password" placeholder="Sua senha" required><button class="button primary full" type="submit">Entrar</button></form></main></body></html>
